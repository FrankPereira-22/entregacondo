<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <meta name="description" content="EntregaCondo - controle móvel de entregas por alameda">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EntregaCondo">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>EntregaCondo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f3f6; font-family: Arial, sans-serif; color: #222; }
    header { background: #1565c0; color: #fff; text-align: center; padding: 18px 15px; }
    header h1 { margin: 0; font-size: 25px; }
    header p { margin: 5px 0 0; font-size: 14px; }
    main { width: 100%; max-width: 600px; margin: auto; padding: 10px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h2 { margin: 0 0 18px; }
    .campo { margin-bottom: 15px; }
    label { display: block; font-weight: 700; margin-bottom: 7px; }
    select, input { width: 100%; height: 52px; border: 1px solid #bbb; border-radius: 8px; padding: 10px; font-size: 18px; background: #fff; }
    button { border: 0; border-radius: 8px; cursor: pointer; font-weight: 700; touch-action: manipulation; }
    .btn-adicionar { width: 100%; height: 56px; background: #2e7d32; color: #fff; font-size: 18px; }
    .btn-adicionar:active, .btn-concluir:active, .btn-tentativa:active, .btn-menor:active { transform: scale(.98); }
    .resumo { display: flex; justify-content: space-around; text-align: center; margin-top: 15px; padding: 12px 4px; background: #f7f9fb; border-radius: 10px; }
    .resumo-item { flex: 1; }
    .resumo-numero { font-size: 27px; font-weight: 700; color: #1565c0; }
    .resumo-legenda { font-size: 13px; color: #555; }
    .titulo-alameda { background: #1565c0; color: #fff; padding: 12px; border-radius: 8px; font-size: 19px; font-weight: 700; margin-top: 18px; }
    .entrega { padding: 15px 0; border-bottom: 1px solid #ddd; }
    .entrega:last-child { border-bottom: 0; }
    .numero { font-size: 22px; font-weight: 700; }
    .pacotes { margin-top: 4px; font-size: 16px; color: #555; }
    .tentativas { margin-top: 5px; color: #e65100; font-size: 15px; font-weight: 700; }
    .concluida { margin-top: 5px; color: #2e7d32; font-weight: 700; }
    .acoes { display: flex; gap: 6px; margin-top: 12px; }
    .btn-menor { width: 48px; height: 48px; color: #fff; font-size: 23px; flex: 0 0 48px; }
    .btn-menos { background: #d32f2f; }
    .btn-mais { background: #388e3c; }
    .btn-tentativa { flex: 1; min-height: 48px; background: #ef6c00; color: #fff; font-size: 14px; padding: 0 10px; }
    .btn-concluir { width: 100%; min-height: 72px; margin-top: 10px; background: #1565c0; color: #fff; font-size: 21px; padding: 10px; }
    .btn-reabrir { background: #757575; }
    .btn-historico { width: 100%; min-height: 44px; margin-top: 9px; background: #eee; color: #333; font-size: 15px; }
    .historico { display: none; margin-top: 10px; background: #f7f7f7; border-radius: 8px; padding: 10px; }
    .historico.aberto { display: block; }
    .historico-titulo { font-weight: 700; margin-bottom: 8px; }
    .historico-item { padding: 7px 0; border-bottom: 1px solid #ddd; font-size: 14px; }
    .historico-item:last-child { border-bottom: 0; }
    .entrega.finalizada { opacity: .58; background: #f7f7f7; padding-left: 10px; padding-right: 10px; border-radius: 8px; }
    .entrega.finalizada .numero { text-decoration: line-through; }
    .vazio { text-align: center; color: #777; padding: 25px 10px; }
    .btn-limpar { width: 100%; height: 50px; margin-top: 15px; background: #b71c1c; color: #fff; font-size: 16px; }
    .dica { margin: -6px 0 12px; color: #666; font-size: 13px; }
    .btn-instalar { display: none; width: 100%; min-height: 50px; margin-bottom: 15px; background: #0d47a1; color: #fff; font-size: 16px; padding: 10px; }
    .btn-instalar.visivel { display: block; }
    .historico-concluidas { margin-top: 10px; }
    .btn-abrir-historico { width: 100%; min-height: 52px; background: #455a64; color: #fff; font-size: 16px; padding: 10px; }
    .painel-historico { display: none; margin-top: 15px; }
    .painel-historico.aberto { display: block; }
    .pesquisa-historico { margin-bottom: 15px; }
    .conclusao-item { padding: 14px 0; border-bottom: 1px solid #ddd; }
    .conclusao-item:last-child { border-bottom: 0; }
    .conclusao-topo { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .conclusao-casa { font-size: 18px; font-weight: 700; }
    .conclusao-alameda { color: #1565c0; font-weight: 700; margin-top: 3px; }
    .conclusao-meta { margin-top: 6px; color: #555; font-size: 14px; line-height: 1.45; }
    .conclusao-data { margin-top: 7px; color: #2e7d32; font-weight: 700; font-size: 14px; }
    .btn-limpar-historico { width: 100%; min-height: 46px; margin-top: 15px; background: #616161; color: #fff; font-size: 15px; }
    @media (max-width: 480px) {
      main { padding: 8px; }
      .card { padding: 14px; }
      .btn-concluir { min-height: 74px; font-size: 21px; }
      .btn-tentativa { font-size: 13px; }
    }
  </style>
</head>
<body>
<header>
  <h1>📦 EntregaCondo</h1>
  <p>Controle de entregas</p>
</header>

<main>
  <button id="btnInstalar" class="btn-instalar" type="button">📲 INSTALAR ENTREGACONDO</button>
  <section class="card">
    <h2>➕ Cadastrar entrega</h2>

    <div class="campo">
      <label for="alameda">Alameda</label>
      <select id="alameda">
        <option value="">Selecione a Alameda</option>
        <option>Amarílis</option>
        <option>Fênix</option>
        <option>Plumas</option>
        <option>Prímulas</option>
        <option>Caliandras</option>
        <option>Tulipas</option>
        <option>Agáves</option>
        <option>Romãs</option>
        <option>Seronéas</option>
        <option>Angelins</option>
      </select>
    </div>

    <div class="campo">
      <label for="numero">Número da residência</label>
      <input id="numero" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="Digite o número">
    </div>

    <div class="campo">
      <label for="quantidade">Quantidade de pacotes</label>
      <input id="quantidade" type="number" inputmode="numeric" min="1" step="1" value="1">
    </div>

    <button class="btn-adicionar" id="btnAdicionar" type="button">➕ ADICIONAR ENTREGA</button>
  </section>

  <section class="card">
    <h2>📋 Visualizar entregas</h2>

    <div class="campo">
      <label for="filtroAlameda">Mostrar entregas da Alameda</label>
      <select id="filtroAlameda">
        <option value="TODAS">Todas as alamedas</option>
        <option>Amarílis</option>
        <option>Fênix</option>
        <option>Plumas</option>
        <option>Prímulas</option>
        <option>Caliandras</option>
        <option>Tulipas</option>
        <option>Agáves</option>
        <option>Romãs</option>
        <option>Seronéas</option>
        <option>Angelins</option>
      </select>
    </div>

    <div class="resumo">
      <div class="resumo-item"><div class="resumo-numero" id="totalResidencias">0</div><div class="resumo-legenda">Residências</div></div>
      <div class="resumo-item"><div class="resumo-numero" id="totalPacotes">0</div><div class="resumo-legenda">Pacotes</div></div>
      <div class="resumo-item"><div class="resumo-numero" id="totalTentativas">0</div><div class="resumo-legenda">Tentativas</div></div>
    </div>

    <div id="listaEntregas"></div>
    <button class="btn-limpar" id="btnLimpar" type="button">🗑️ LIMPAR TODAS AS ENTREGAS</button>
  </section>

  <section class="card">
    <button class="btn-abrir-historico" id="btnAbrirHistoricoConcluidas" type="button" aria-expanded="false">📚 ABRIR HISTÓRICO DE CONCLUÍDAS</button>

    <div class="painel-historico" id="painelHistoricoConcluidas">
    <h2>📚 Histórico de entregas concluídas</h2>

    <div class="campo pesquisa-historico">
      <label for="pesquisaHistorico">Pesquisar entrega concluída</label>
      <input id="pesquisaHistorico" type="search" autocomplete="off" placeholder="Casa, alameda ou data">
    </div>

    <div class="campo">
      <label for="filtroHistoricoAlameda">Mostrar histórico da Alameda</label>
      <select id="filtroHistoricoAlameda">
        <option value="TODAS">Todas as alamedas</option>
        <option>Amarílis</option>
        <option>Fênix</option>
        <option>Plumas</option>
        <option>Prímulas</option>
        <option>Caliandras</option>
        <option>Tulipas</option>
        <option>Agáves</option>
        <option>Romãs</option>
        <option>Seronéas</option>
        <option>Angelins</option>
      </select>
    </div>

    <div id="listaHistoricoConcluidas" class="historico-concluidas"></div>
    <button class="btn-limpar-historico" id="btnLimparHistorico" type="button">🗑️ LIMPAR HISTÓRICO DE CONCLUÍDAS</button>
    </div>
  </section>
</main>

<script>
  const CHAVE_STORAGE = "entregaCondo";
  const CHAVE_HISTORICO_CONCLUIDAS = "entregaCondoHistoricoConcluidas";
  const UM_DIA_MS = 24 * 60 * 60 * 1000;
  const RETENCAO_HISTORICO_MS = 30 * UM_DIA_MS;
  const alamedas = ["Amarílis", "Fênix", "Plumas", "Prímulas", "Caliandras", "Tulipas", "Agáves", "Romãs", "Seronéas", "Angelins"];

  const elAlameda = document.getElementById("alameda");
  const elNumero = document.getElementById("numero");
  const elQuantidade = document.getElementById("quantidade");
  const elFiltro = document.getElementById("filtroAlameda");
  const elLista = document.getElementById("listaEntregas");
  const elFiltroHistorico = document.getElementById("filtroHistoricoAlameda");
  const elListaHistoricoConcluidas = document.getElementById("listaHistoricoConcluidas");
  const elPesquisaHistorico = document.getElementById("pesquisaHistorico");
  const elPainelHistorico = document.getElementById("painelHistoricoConcluidas");
  const elBtnAbrirHistorico = document.getElementById("btnAbrirHistoricoConcluidas");

  let entregas = carregarEntregas();
  let historicoConcluidas = carregarHistoricoConcluidas();

  function carregarEntregas() {
    try {
      const dados = JSON.parse(localStorage.getItem(CHAVE_STORAGE)) || [];
      return Array.isArray(dados) ? dados.map(normalizarEntrega) : [];
    } catch (erro) {
      console.error("Erro ao carregar dados:", erro);
      return [];
    }
  }

  function carregarHistoricoConcluidas() {
    try {
      const dados = JSON.parse(localStorage.getItem(CHAVE_HISTORICO_CONCLUIDAS)) || [];
      return Array.isArray(dados) ? dados : [];
    } catch (erro) {
      console.error("Erro ao carregar histórico de concluídas:", erro);
      return [];
    }
  }

  function salvarHistoricoConcluidas() {
    localStorage.setItem(CHAVE_HISTORICO_CONCLUIDAS, JSON.stringify(historicoConcluidas));
  }

  function normalizarEntrega(item) {
    return {
      id: Number(item.id) || Date.now() + Math.floor(Math.random() * 10000),
      alameda: String(item.alameda || ""),
      numero: String(item.numero || ""),
      pacotes: Math.max(1, Number(item.pacotes) || 1),
      tentativas: Math.max(0, Number(item.tentativas) || 0),
      historico: Array.isArray(item.historico) ? item.historico : [],
      entregue: Boolean(item.entregue),
      concluidaTimestamp: Number(item.concluidaTimestamp) || 0
    };
  }

  function inicioDoDia(timestamp = Date.now()) {
    const data = new Date(timestamp);
    return new Date(data.getFullYear(), data.getMonth(), data.getDate()).getTime();
  }

  function fazerManutencaoAutomatica() {
    const agora = Date.now();
    const hoje = inicioDoDia(agora);
    const totalEntregas = entregas.length;
    const totalHistorico = historicoConcluidas.length;

    // Concluídas continuam visíveis até o fim do dia e depois saem apenas da lista ativa.
    entregas = entregas.filter(item => {
      if (!item.entregue) return true;
      const concluidaEm = Number(item.concluidaTimestamp) || agora;
      return inicioDoDia(concluidaEm) >= hoje;
    });

    // O histórico separado permanece por 30 dias.
    historicoConcluidas = historicoConcluidas.filter(item => {
      const timestamp = Number(item.timestamp);
      return timestamp > 0 && agora - timestamp < RETENCAO_HISTORICO_MS;
    });

    if (entregas.length !== totalEntregas) salvar();
    if (historicoConcluidas.length !== totalHistorico) salvarHistoricoConcluidas();
  }

  function salvar() {
    localStorage.setItem(CHAVE_STORAGE, JSON.stringify(entregas));
  }

  function adicionarEntrega() {
    const alameda = elAlameda.value;
    const numero = elNumero.value.trim().toUpperCase();
    const quantidade = Number(elQuantidade.value);

    if (!alameda) {
      alert("Selecione uma Alameda.");
      elAlameda.focus();
      return;
    }

    if (!numero) {
      alert("Digite o número da residência.");
      elNumero.focus();
      return;
    }

    if (!Number.isInteger(quantidade) || quantidade < 1) {
      alert("Digite uma quantidade válida de pacotes.");
      elQuantidade.focus();
      return;
    }

    const existente = entregas.find(item =>
      item.alameda === alameda && item.numero.toUpperCase() === numero
    );

    if (existente) {
      if (!existente.entregue && existente.tentativas > 0) {
        const confirmar = confirm(
          `ATENÇÃO: a entrega da casa ${numero}, Alameda ${alameda}, está pendente e já possui ${existente.tentativas} ${existente.tentativas === 1 ? "tentativa registrada" : "tentativas registradas"}.\n\nDeseja realmente adicionar mais ${quantidade} ${quantidade === 1 ? "pacote" : "pacotes"} a essa entrega?`
        );
        if (!confirmar) return;
      }
      existente.pacotes += quantidade;
      existente.entregue = false;
      existente.concluidaTimestamp = 0;
    } else {
      entregas.push({
        id: Date.now(),
        alameda,
        numero,
        pacotes: quantidade,
        tentativas: 0,
        historico: [],
        entregue: false,
        concluidaTimestamp: 0
      });
    }

    salvar();

    // Ao cadastrar, já mostra a Alameda usada. Isso agiliza a conferência no celular.
    elFiltro.value = alameda;

    elNumero.value = "";
    elQuantidade.value = "1";
    renderizar();
    elNumero.focus();
  }

  function compararNumeros(a, b) {
    return String(a.numero).localeCompare(String(b.numero), "pt-BR", {
      numeric: true,
      sensitivity: "base"
    });
  }

  function obterEntrega(id) {
    return entregas.find(item => item.id === Number(id));
  }

  function aumentar(id) {
    const entrega = obterEntrega(id);
    if (!entrega) return;
    entrega.pacotes += 1;
    entrega.entregue = false;
    entrega.concluidaTimestamp = 0;
    salvar();
    renderizar();
  }

  function diminuir(id) {
    const entrega = obterEntrega(id);
    if (!entrega) return;

    entrega.pacotes -= 1;

    if (entrega.pacotes <= 0) {
      const confirmar = confirm("Remover esta residência da lista de entregas?");
      if (!confirmar) {
        entrega.pacotes = 1;
      } else {
        entregas = entregas.filter(item => item.id !== entrega.id);
      }
    }

    salvar();
    renderizar();
  }

  function adicionarTentativa(id) {
    const entrega = obterEntrega(id);
    if (!entrega) return;

    entrega.tentativas = Math.max(0, Number(entrega.tentativas) || 0) + 1;
    if (!Array.isArray(entrega.historico)) entrega.historico = [];

    const agora = new Date();
    entrega.historico.push({
      numero: entrega.tentativas,
      data: agora.toLocaleDateString("pt-BR"),
      hora: agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
    });

    entrega.entregue = false;
    salvar();
    renderizar();
  }

  function concluirEntrega(id) {
    const entrega = obterEntrega(id);
    if (!entrega) return;

    if (!entrega.entregue) {
      const agora = new Date();
      historicoConcluidas.unshift({
        id: Date.now(),
        entregaId: entrega.id,
        alameda: entrega.alameda,
        numero: entrega.numero,
        pacotes: entrega.pacotes,
        tentativas: entrega.tentativas || 0,
        data: agora.toLocaleDateString("pt-BR"),
        hora: agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
        timestamp: agora.getTime()
      });
      entrega.entregue = true;
      entrega.concluidaTimestamp = agora.getTime();
      salvarHistoricoConcluidas();
    } else {
      entrega.entregue = false;
      entrega.concluidaTimestamp = 0;
    }

    salvar();
    renderizar();
    renderizarHistoricoConcluidas();
  }

  function alternarHistorico(id) {
    const elemento = document.getElementById(`historico-${id}`);
    const botao = document.getElementById(`btn-historico-${id}`);
    if (!elemento) return;

    const abriu = elemento.classList.toggle("aberto");
    if (botao) botao.textContent = abriu ? "📅 OCULTAR HISTÓRICO" : "📅 VER HISTÓRICO";
  }

  function escaparHTML(valor) {
    return String(valor)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function criarBlocoAlameda(lista, alameda, entregasAlameda) {
    const titulo = document.createElement("div");
    titulo.className = "titulo-alameda";
    titulo.textContent = alameda;
    lista.appendChild(titulo);

    entregasAlameda.sort(compararNumeros).forEach(entrega => {
      const div = document.createElement("div");
      div.className = "entrega" + (entrega.entregue ? " finalizada" : "");

      const numeroSeguro = escaparHTML(entrega.numero);
      let historicoHTML = "";

      if (entrega.historico.length > 0) {
        historicoHTML = `
          <button class="btn-historico" id="btn-historico-${entrega.id}" type="button" onclick="alternarHistorico(${entrega.id})">📅 VER HISTÓRICO</button>
          <div class="historico" id="historico-${entrega.id}">
            <div class="historico-titulo">Histórico de tentativas</div>
            ${entrega.historico.map(t => `
              <div class="historico-item">🔄 Tentativa <strong>${t.numero}</strong> — ${escaparHTML(t.data)} às ${escaparHTML(t.hora)}</div>
            `).join("")}
          </div>`;
      }

      const tentativasHTML = entrega.tentativas > 0
        ? `<div class="tentativas">🔄 ${entrega.tentativas} ${entrega.tentativas === 1 ? "tentativa" : "tentativas"}</div>`
        : "";

      const statusHTML = entrega.entregue
        ? `<div class="concluida">✓ ENTREGA CONCLUÍDA</div>`
        : "";

      const acoesHTML = entrega.entregue
        ? `<button class="btn-concluir btn-reabrir" type="button" onclick="concluirEntrega(${entrega.id})">↩ REABRIR ENTREGA</button>`
        : `
          <div class="acoes">
            <button class="btn-menor btn-menos" type="button" onclick="diminuir(${entrega.id})" aria-label="Diminuir pacotes">−</button>
            <button class="btn-menor btn-mais" type="button" onclick="aumentar(${entrega.id})" aria-label="Aumentar pacotes">+</button>
            <button class="btn-tentativa" type="button" onclick="adicionarTentativa(${entrega.id})">🔄 REGISTRAR TENTATIVA</button>
          </div>
          <button class="btn-concluir" type="button" onclick="concluirEntrega(${entrega.id})">✓ CONCLUIR ENTREGA</button>`;

      div.innerHTML = `
        <div class="numero">🏠 ${numeroSeguro}</div>
        <div class="pacotes">📦 ${entrega.pacotes} ${entrega.pacotes === 1 ? "pacote" : "pacotes"}</div>
        ${tentativasHTML}
        ${statusHTML}
        ${acoesHTML}
        ${historicoHTML}`;

      lista.appendChild(div);
    });
  }

  function atualizarResumo(lista) {
    document.getElementById("totalResidencias").textContent = lista.length;
    document.getElementById("totalPacotes").textContent = lista.reduce((total, item) => total + item.pacotes, 0);
    document.getElementById("totalTentativas").textContent = lista.reduce((total, item) => total + (item.tentativas || 0), 0);
  }

  function renderizar() {
    const filtro = elFiltro.value;
    const filtradas = entregas.filter(item => filtro === "TODAS" || item.alameda === filtro);

    elLista.innerHTML = "";
    atualizarResumo(filtradas);

    if (filtradas.length === 0) {
      elLista.innerHTML = '<div class="vazio">Nenhuma entrega encontrada.</div>';
      return;
    }

    if (filtro === "TODAS") {
      alamedas.forEach(alameda => {
        const daAlameda = filtradas.filter(item => item.alameda === alameda);
        if (daAlameda.length > 0) criarBlocoAlameda(elLista, alameda, daAlameda);
      });
    } else {
      criarBlocoAlameda(elLista, filtro, filtradas);
    }
  }

  function renderizarHistoricoConcluidas() {
    const filtro = elFiltroHistorico.value;
    const pesquisa = elPesquisaHistorico.value.trim().toLocaleLowerCase("pt-BR");
    const lista = historicoConcluidas
      .filter(item => filtro === "TODAS" || item.alameda === filtro)
      .filter(item => {
        if (!pesquisa) return true;
        const texto = `${item.numero || ""} ${item.alameda || ""} ${item.data || ""} ${item.hora || ""}`.toLocaleLowerCase("pt-BR");
        return texto.includes(pesquisa);
      })
      .slice()
      .sort((a, b) => (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0));

    elListaHistoricoConcluidas.innerHTML = "";

    if (lista.length === 0) {
      elListaHistoricoConcluidas.innerHTML = '<div class="vazio">Nenhuma entrega concluída no histórico.</div>';
      return;
    }

    lista.forEach(item => {
      const div = document.createElement("div");
      div.className = "conclusao-item";
      div.innerHTML = `
        <div class="conclusao-casa">🏠 Casa ${escaparHTML(item.numero)}</div>
        <div class="conclusao-alameda">${escaparHTML(item.alameda)}</div>
        <div class="conclusao-meta">📦 ${Number(item.pacotes) || 0} ${(Number(item.pacotes) || 0) === 1 ? "pacote" : "pacotes"} · 🔄 ${Number(item.tentativas) || 0} ${(Number(item.tentativas) || 0) === 1 ? "tentativa" : "tentativas"}</div>
        <div class="conclusao-data">✓ Concluída em ${escaparHTML(item.data || "")} às ${escaparHTML(item.hora || "")}</div>`;
      elListaHistoricoConcluidas.appendChild(div);
    });
  }

  function alternarHistoricoConcluidas() {
    const abriu = elPainelHistorico.classList.toggle("aberto");
    elBtnAbrirHistorico.setAttribute("aria-expanded", String(abriu));
    elBtnAbrirHistorico.textContent = abriu
      ? "📚 OCULTAR HISTÓRICO DE CONCLUÍDAS"
      : "📚 ABRIR HISTÓRICO DE CONCLUÍDAS";
    if (abriu) {
      fazerManutencaoAutomatica();
      renderizarHistoricoConcluidas();
    }
  }

  function limparHistoricoConcluidas() {
    if (historicoConcluidas.length === 0) return;
    if (!confirm("Tem certeza que deseja apagar o histórico de entregas concluídas?")) return;
    historicoConcluidas = [];
    salvarHistoricoConcluidas();
    renderizarHistoricoConcluidas();
  }

  function limparTudo() {
    if (entregas.length === 0) return;
    if (!confirm("Tem certeza que deseja apagar TODAS as entregas?")) return;
    entregas = [];
    salvar();
    renderizar();
  }

  document.getElementById("btnAdicionar").addEventListener("click", adicionarEntrega);
  document.getElementById("btnLimpar").addEventListener("click", limparTudo);
  document.getElementById("btnLimparHistorico").addEventListener("click", limparHistoricoConcluidas);
  elBtnAbrirHistorico.addEventListener("click", alternarHistoricoConcluidas);
  elFiltro.addEventListener("change", renderizar);
  elFiltroHistorico.addEventListener("change", renderizarHistoricoConcluidas);
  elPesquisaHistorico.addEventListener("input", renderizarHistoricoConcluidas);
  elNumero.addEventListener("keydown", event => {
    if (event.key === "Enter") adicionarEntrega();
  });

  // PWA: instalação e funcionamento offline
  let eventoInstalacao = null;
  const btnInstalar = document.getElementById("btnInstalar");

  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    eventoInstalacao = event;
    btnInstalar.classList.add("visivel");
  });

  btnInstalar.addEventListener("click", async () => {
    if (!eventoInstalacao) return;
    eventoInstalacao.prompt();
    await eventoInstalacao.userChoice;
    eventoInstalacao = null;
    btnInstalar.classList.remove("visivel");
  });

  window.addEventListener("appinstalled", () => {
    eventoInstalacao = null;
    btnInstalar.classList.remove("visivel");
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(error => {
        console.error("Falha ao registrar Service Worker:", error);
      });
    });
  }

  fazerManutencaoAutomatica();
  renderizar();
  renderizarHistoricoConcluidas();

  // Repete a manutenção quando o app volta ao primeiro plano e logo após cada virada de dia.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    fazerManutencaoAutomatica();
    renderizar();
    renderizarHistoricoConcluidas();
  });

  const milissegundosAteAmanha = inicioDoDia(Date.now() + UM_DIA_MS) - Date.now() + 1000;
  setTimeout(() => {
    fazerManutencaoAutomatica();
    renderizar();
    renderizarHistoricoConcluidas();
    setInterval(() => {
      fazerManutencaoAutomatica();
      renderizar();
      renderizarHistoricoConcluidas();
    }, UM_DIA_MS);
  }, milissegundosAteAmanha);
</script>
</body>
</html>
